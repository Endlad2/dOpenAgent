name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: windows
            ext: .exe
          - os: ubuntu-latest
            target: linux
            ext: ''
    
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install playwright
        pip install -r requirements.txt || echo "No requirements.txt"
        playwright install chromium
        playwright install-deps
      shell: bash
    
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install playwright
        pip install -r requirements.txt || echo "No requirements.txt"
        playwright install chromium
        playwright install-deps
      shell: bash
    
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --name dopenagent-windows --add-data "system_prompt.txt;." agent.py
      shell: bash
    
    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name dopenagent-linux --add-data "system_prompt.txt:." agent.py
      shell: bash
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dopenagent-${{ matrix.target }}
        path: dist/dopenagent-${{ matrix.target }}${{ matrix.ext }}
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/dopenagent-${{ matrix.target }}${{ matrix.ext }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List artifacts
      run: |
        ls -la artifacts/
        ls -la artifacts/dopenagent-windows/ || echo "No windows artifact"
        ls -la artifacts/dopenagent-linux/ || echo "No linux artifact"
    
    - name: Create Release with all artifacts
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/dopenagent-windows/dopenagent-windows.exe
          artifacts/dopenagent-linux/dopenagent-linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
